<nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <span class="navbar-brand">Basket</span>
  </div>
</nav>

<div class="container-fluid p-3 pb-5 mb-5">
  @if (_basket().length === 0) {
    <div class="card text-center">
      <div class="card-body py-5">
        <h1 class="h4 card-title">Your basket is empty</h1>
        <p class="card-text text-body-secondary">Browse the catalogue to add items to an order.</p>
        <a class="btn btn-success" routerLink="/items">Browse items</a>
      </div>
    </div>
  } @else {
    <app-basket-table [basket]="_basket()" />

    @if (orderError()) {
      <div class="alert alert-danger mt-3 mb-0" role="alert" data-testid="order-error">{{ orderError() }}</div>
    }

    <div class="d-grid mt-3">
      <button type="button" class="btn btn-success btn-lg text-uppercase" data-testid="place-order"
              [disabled]="isPlacing()" (click)="placeOrder()">
        @if (isPlacing()) {
          Placing order…
        } @else if (authService.isLoggedIn()) {
          Place order
        } @else {
          Log in to place order
        }
      </button>
    </div>
  }
</div>

@if (orderPlaced()) {
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="orderPlacedTitle"
       data-testid="order-placed-dialog">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-bg-success">
        <div class="modal-header">
          <h2 class="modal-title fs-5 text-uppercase" id="orderPlacedTitle">Order placed</h2>
          <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="closeDialog()"></button>
        </div>
        <div class="modal-body text-center py-4">
          Your order has been successfully placed.<br>Thank you
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-light" (click)="closeDialog()">Okidoki</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop show"></div>
}
