<div class="card mb-3 overflow-hidden" style="width: 18rem; height: 15rem;"
     [class.text-bg-success]="item().stockUrgency === StockUrgencyEnum.HIGH"
     [class.text-bg-warning]="item().stockUrgency === StockUrgencyEnum.MEDIUM"
     [class.text-bg-danger]="item().stockUrgency === StockUrgencyEnum.LOW"
     routerLink="/items/{{item().id}}"
>

  <div class="card-header text-truncate text-capitalize">{{ item().name }}</div>

  <div class="position-relative flex-grow-1">
    <img [ngSrc]="imageSrc()" [alt]="item().name" fill class="object-fit-cover" />
  </div>

  <div class="card-body d-flex justify-content-between align-items-center gap-2 flex-grow-0">
    <span class="fw-bold text-nowrap">Price: {{ item().price | currency:'EUR' }}</span>
    <span class="small text-end text-truncate text-capitalize">{{ item().stockUrgency }}</span>
  </div>
</div>
