<div class="border rounded-3 overflow-auto py-3">
  <table class="table table-striped table-hover align-middle mb-0">
    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Firstname</th>
      <th scope="col">Lastname</th>
      <th scope="col">
        <button class="btn btn-success" routerLink="/customers/new">Add Customer</button>
      </th>
    </tr>
    </thead>
    <tbody>

      @for (user of _users(); track user.id) {
        <tr>
          <th scope="row">{{ user.id }}</th>
          <td>{{ user.lastname }}</td>
          <td>{{ user.firstname }}</td>
          <td>
            <div class="btn-group" role="group">
              <button class="btn btn-secondary" routerLink="/customers/{{user.id}}">View</button>
              <button class="btn btn-primary" routerLink="/customers/{{user.id}}/edit">Edit</button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
